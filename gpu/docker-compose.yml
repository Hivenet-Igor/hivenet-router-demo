# GPU VM: 4x RTX 5090, two tensor-parallel (TP2) replicas, one agent sidecar each.
#   GPUs 0,1  vLLM  HivenetQuant/Qwen3.8-27B      -> 127.0.0.1:8001  <- agent-27b
#   GPUs 2,3  vLLM  HivenetQuant/Qwen3.6-35B-A3B  -> 127.0.0.1:8002  <- agent-35b
# No inbound port: the agents dial out to the router.
# vLLM version: v0.30.0 by default. To fall back to the previously
# certified image, start with: VLLM_VERSION=v0.26.0 docker compose up -d ...
# .env (pasted from the router's up.sh) sets HIVENET_ROUTER_JWT_SECRET,
# ROUTER_ADDR and ROUTER_GRPC_PORT.

x-vllm: &vllm
  entrypoint: ["vllm", "serve"]
  runtime: nvidia
  ipc: host
  restart: unless-stopped

x-vllm-env: &vllm-env
  NCCL_P2P_DISABLE: "1"
  NCCL_IB_DISABLE: "1"
  FLASHINFER_CUDA_ARCH_LIST: "12.0f"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"

x-agent: &agent
  image: ghcr.io/hivenetoss/hivenet-agent:v0.1.3
  network_mode: host
  runtime: nvidia
  restart: unless-stopped
  volumes: ["./ids:/id"]

services:
  vllm-27b:
    <<: *vllm
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.30.0}
    environment:
      <<: *vllm-env
      NVIDIA_VISIBLE_DEVICES: "0,1"
    volumes: ["${HOME}/models/Qwen3.8-27B-NVFP4:/model:ro"]
    ports: ["127.0.0.1:8001:8000"]
    command: >
      /model
      --served-model-name HivenetQuant/Qwen3.8-27B
      --tensor-parallel-size 2
      --max-model-len 262144
      --max-num-seqs 64
      --max-num-batched-tokens 16384
      --gpu-memory-utilization 0.90
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --async-scheduling
      --performance-mode balanced
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --limit-mm-per-prompt '{"image": 10}'

  vllm-35b:
    <<: *vllm
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.30.0}
    environment:
      <<: *vllm-env
      NVIDIA_VISIBLE_DEVICES: "2,3"
    volumes: ["${HOME}/models/Qwen3.6-35B-A3B-NVFP4:/model:ro"]
    ports: ["127.0.0.1:8002:8000"]
    command: >
      /model
      --served-model-name HivenetQuant/Qwen3.6-35B-A3B
      --tensor-parallel-size 2
      --max-model-len 262144
      --max-num-seqs 64
      --max-num-batched-tokens 16384
      --gpu-memory-utilization 0.90
      --kv-cache-dtype fp8
      --enable-prefix-caching
      --async-scheduling
      --performance-mode balanced
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --limit-mm-per-prompt '{"image": 10}'

  agent-27b:
    <<: *agent
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1"
      HIVENET_ROUTER_JWT_SECRET: ${HIVENET_ROUTER_JWT_SECRET:?paste .env from the router}
    command:
      - --engine=vllm
      - --backend-url=http://127.0.0.1:8001
      - --model=HivenetQuant/Qwen3.8-27B
      - --capacity=64
      - --region=EU-France
      - --organization=Hivenet Compute
      - --machine=gpu-vm
      - --gpu-model=RTX5090
      - --deployment-id=qwen27b
      - --replica-id=r0
      - --identity-path=/id/agent-27b.key
      - --p2p-listen-port=9100
      - --router-grpc=${ROUTER_ADDR:?paste .env from the router}:${ROUTER_GRPC_PORT:-9001}

  agent-35b:
    <<: *agent
    environment:
      NVIDIA_VISIBLE_DEVICES: "2,3"
      HIVENET_ROUTER_JWT_SECRET: ${HIVENET_ROUTER_JWT_SECRET:?paste .env from the router}
    command:
      - --engine=vllm
      - --backend-url=http://127.0.0.1:8002
      - --model=HivenetQuant/Qwen3.6-35B-A3B
      - --capacity=64
      - --region=EU-France
      - --organization=Hivenet Compute
      - --machine=gpu-vm
      - --gpu-model=RTX5090
      - --deployment-id=qwen35b
      - --replica-id=r1
      - --identity-path=/id/agent-35b.key
      - --p2p-listen-port=9101
      - --router-grpc=${ROUTER_ADDR:?paste .env from the router}:${ROUTER_GRPC_PORT:-9001}
